# Builds and tests the platform on every push to main and every pull request: the checks of
# "Before calling a change done" in CLAUDE.md, the Liquibase rollbacks on real PostgreSQL, and the
# scheduler image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (oxlint and the architecture check)
        run: pnpm lint
      - name: Build both services
        run: pnpm build
      - name: Unit tests, and the lock store's and RabbitMQ transport's contract suites (Testcontainers)
        run: pnpm test
      - name: E2E tests (each service on its own PostgreSQL in Docker, via Testcontainers, with its Liquibase changesets)
        run: pnpm test:e2e

  migrations:
    name: Liquibase changesets and rollbacks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The two databases as in compose.yaml, on the same ports: scripts/database targets them by default.
    services:
      workout-tracking-db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: workout_tracking
          POSTGRES_USER: workout_tracking
          POSTGRES_PASSWORD: workout_tracking
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U workout_tracking -d workout_tracking"
          --health-interval 2s --health-timeout 3s --health-retries 30
      training-progress-db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: training_progress
          POSTGRES_USER: training_progress
          POSTGRES_PASSWORD: training_progress
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U training_progress -d training_progress"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # Applies every changeset, test records included, rolls them all back, and applies them again.
      - name: Workout Tracking's changesets and rollbacks
        run: scripts/database/liquibase.sh workout-tracking update-testing-rollback
      - name: Training Progress' changesets and rollbacks
        run: scripts/database/liquibase.sh training-progress update-testing-rollback

  scheduler:
    name: Scheduler image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the scheduler image
        run: docker build -t fitness-scheduler scripts/scheduler
