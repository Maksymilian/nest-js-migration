# Workout Tracking's database (PostgreSQL instance 1). Liquibase owns every DDL statement, the
# outbox store's schema included. Never edit an applied changeset: add a new one.
# Changesets with `context:test-data` only run where the context filter includes it (docker compose).
databaseChangeLog:
  - include:
      file: changesets/0001-workout-tracking-tables.sql
      relativeToChangelogFile: true
  - include:
      file: changesets/0002-outbox-store.sql
      relativeToChangelogFile: true
  - include:
      file: test-data/0001-equipment.sql
      relativeToChangelogFile: true
